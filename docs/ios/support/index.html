<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>使用帮助 · 无限库 WFDB iPhone 版</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap nav">
      <a class="brand" href="../../"><span class="brand-mark" aria-hidden="true">&gt;_</span>WFDB</a>
    </div>
  </header>
  <main class="wrap page-main">
    <section class="page-intro">
      <h1>无限库 WFDB iPhone 版使用帮助</h1>
      <p>在 iPhone 上查阅钓鱼资料并记录自己的渔获。</p>
    </section>
    <section>
      <h2>查鱼和钓点</h2>
      <p>在「图鉴」按鱼名或物品编号搜索，也可以选择游戏水域。鱼的详情会注明参考来源。</p>
    </section>
    <section>
      <h2>管理渔获</h2>
      <p>从鱼的详情选择「记一笔渔获」，或从「渔获」页添加。点记录可编辑，也可以向左滑动后删除。图鉴与日志均可离线使用。</p>
    </section>
    <section>
      <h2>联系维护者</h2>
      <p>在 <a href="https://github.com/bluexp/bobber-tally/issues">WFDB 项目的 GitHub Issues</a> 报告问题。请附上 App 版本、iOS 版本和复现步骤。Issue 公开可见，请勿附上私人信息。也可查阅 <a href="../privacy/">隐私政策</a>。</p>
    </section>
  </main>
</body>
</html>
